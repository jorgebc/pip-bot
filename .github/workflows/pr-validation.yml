name: PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Check lockfile
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-ansi

      - name: Update setuptools for dependency audit
        run: poetry run python -m pip install --upgrade "setuptools>=84.1.0"

      - name: Lint
        run: poetry run ruff check .

      - name: Type check
        run: poetry run mypy bot/ cogs/ services/ config/ utils/

      - name: Test
        run: poetry run pytest

      - name: Dependency audit
        run: poetry run pip-audit --skip-editable

      - name: Security scan
        run: poetry run bandit -c pyproject.toml -r bot/ cogs/ services/ config/ utils/ -q
